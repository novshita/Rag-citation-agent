name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]   # the oldest supported, and the newest it has been run on
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only PyTorch first: the default Linux wheel pulls in GPU libraries (gigabytes) the tests don't need.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # Offline tests only: they use fakes, so no API key or model download is needed.
      # The `live` tests are skipped by default (see pyproject.toml).
      - name: Test
        run: pytest -q
