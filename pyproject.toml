[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-citation-agent"
version = "0.1.0"
description = "RAG agent that answers only from a document corpus, with verified citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real LLM/embedding services (skipped by default)"]
addopts = "-m 'not live'"
