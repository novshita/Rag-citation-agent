          <h1 class="lp-h1">Ask the documents.<br><span>See the proof.</span></h1>
          <p class="lp-lede">Every answer is written only from passages in the indexed documents. Every quote is checked against its source by code, not by AI. If the documents don't say, it says so.</p>
          <div class="lp-cta">
            <a class="lp-btn lp-primary" href="#/login" data-cta>Try the demo<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
            <a class="lp-btn lp-ghost" href="#/evaluation">How it was evaluated</a>
          </div>
          <ul class="lp-checks">
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>No outside knowledge</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>Quotes verified in code</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>Refuses to guess</li>
          </ul>
        </div>

        <div class="lp-example" aria-label="An example answer">
          <div class="lp-example-bar"><i></i><i></i><i></i><span>example answer</span></div>
          <div class="lp-example-body">
            <div><div class="mono-cap">Question</div><div class="lp-example-q">Which Python package must be installed to receive uploaded files?</div></div>
            <div class="lp-example-meta">
              <span class="lp-status"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>Answered</span>

              <span class="mono small">2.2 s · 1,860 tokens</span>

              <div class="lp-proof-head"><span class="lp-num">[1]</span><span class="mono">tutorial/request-files.md</span><span class="lp-found"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>Quote found in source</span></div>

            </div>
          </div>
        </div>
      </section>

      <section class="lp-stats" aria-label="Key numbers">
        <div><b>136 / 137</b><span>citations verified against their source passages</span></div>
        <div><b>25%</b><span>answered on questions the documents can't answer, vs 100% for a plain chatbot</span></div>
        <div><b><span data-fill="pages">30</span> pages</b><span>FastAPI documentation indexed, about <span data-fill="words">49,000</span> words</span></div>
        <div><b data-fill="threshold">0.42</b><span>relevance threshold the best match must clear before any model call</span></div>
      </section>

      <section class="lp-section" id="example">
        <div data-slot="belt"></div>
        <ol class="lp-steps">
          <li><div class="lp-step-head"><span class="n">1</span><b>Retrieve</b><span class="tag">code</span></div><p>Find the most relevant passages in the indexed documents.</p></li>
          <li><div class="lp-step-head"><span class="n">2</span><b>Relevance gate</b><span class="tag">code</span></div><p>If none is close enough, stop and say “I don't know”.</p></li>
          <li><div class="lp-step-head"><span class="n">3</span><b>Answer with quotes</b><span class="tag" data-fill="llm">model</span></div><p>The model writes the answer and must quote exact text for every claim.</p></li>
          <li><div class="lp-step-head"><span class="n">4</span><b>Verify in code</b><span class="tag">code</span></div><p>Every quote is checked against its source. Fake quotes are removed.</p></li>
        </ol>
      </section>

      <section class="lp-section lp-principles" id="principles">
        <div class="lp-sec-head">
          <div><p class="mono-eyebrow">Principles</p><h2>Built to be checked, not trusted.</h2></div>
          <p class="lp-sec-note">Three rules decide every answer. None of them depends on the language model behaving.</p>
        </div>
        <div class="lp-cards">
          <article><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></span><h3>Only your documents</h3><p>No outside knowledge. Answers use retrieved passages only, so every statement traces back to a page you indexed.</p><div class="foot">Sources shown with every answer</div></article>
          <article><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.2 8 8 9 4.8-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span><h3>Every quote verified</h3><p>Code, not AI, checks each quote against its source. Anything that does not match exactly is removed.</p><div class="foot">136 of 137 citations verified</div></article>
          <article><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></span><h3>Refuses to guess</h3><p>If no passage is relevant enough, it stops at the gate. No model is called and nothing is invented.</p><div class="foot">Best match below <span data-fill="threshold">0.42</span> means no answer</div></article>
        </div>
      </section>

      <section class="lp-evidence" id="evidence">
        <div class="lp-evidence-in">
          <div class="lp-evidence-copy">
            <p class="mono-eyebrow">Evidence</p>
            <h2>Measured, not claimed.</h2>
            <p>On questions the documents can't answer, a plain chatbot answered every one. This system answered 2 of 8, both hedged and cited; the relevance gate stops the rest before any model is called.</p>
            <a class="lp-btn lp-white" href="#/evaluation">How it was evaluated<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
          </div>
          <div class="lp-evidence-card">
            <div class="ev"><div class="ev-top"><span>Plain chatbot · answered anyway</span><b>100%</b></div><div class="ev-track"><i style="width:100%" class="grey"></i></div><p>On questions the documents cannot answer. Lower is better.</p></div>
            <div class="ev"><div class="ev-top"><span>RAG Citation Agent · answered anyway</span><b>25%</b></div><div class="ev-track"><i style="width:25%" class="accent"></i></div><p>The relevance gate declines the rest before any model call.</p></div>
            <div class="ev"><div class="ev-top"><span>Citations verified in code</span><b>136 / 137</b></div><div class="ev-track"><i style="width:99.3%" class="green"></i></div><p>Each quote is matched exactly against its source passage.</p></div>
          </div>
        </div>
      </section>
